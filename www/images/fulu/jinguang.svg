<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="paper_jinguang"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="n"/><feDiffuseLighting in="n" lighting-color="#f4e4bc" surfaceScale="1.2"><feDistantLight azimuth="45" elevation="60"/></feDiffuseLighting></filter>
  </defs>
  <!-- 符纸 -->
  <rect x="8" y="8" width="384" height="584" fill="#f4e4bc" stroke="#8b5a2b" stroke-width="3" filter="url(#paper_jinguang)"/>
  <rect x="16" y="16" width="368" height="568" fill="none" stroke="#8b5a2b" stroke-width="1"/>

  <!-- 敕令头 -->
  <g fill="#b8860b">
    <rect x="120" y="28" width="160" height="48" rx="3"/>
    <path d="M110,32 L120,40 L110,48 L120,56 L110,64" stroke="#b8860b" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M290,32 L280,40 L290,48 L280,56 L290,64" stroke="#b8860b" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  <text x="200" y="60" text-anchor="middle" fill="#f4e4bc" font-size="30" font-family="'Noto Serif SC',serif" font-weight="bold" letter-spacing="4">敕令</text>

  <!-- 主咒文(避免与符胆重叠) -->
  <g fill="#b8860b" font-family="'Noto Serif SC',serif" font-weight="bold" text-anchor="middle">
    <text x="200" y="130" font-size="26">金光速现</text>
    <text x="200" y="166" font-size="22">覆护真人</text>
    <text x="200" y="202" font-size="22">天地玄宗</text>
    <text x="200" y="238" font-size="22">万炁本根</text>
  </g>

  <!-- 符胆元素(下移到 y=320 避开咒文) -->
  <g transform="translate(200,330)" fill="none" stroke="#b8860b" stroke-width="2" opacity="0.6">
      <circle cx="0" cy="0" r="30" fill="#b8860b" opacity="0.3"/>
      <path d="M0,-70 L0,-40 M0,40 L0,70 M-70,0 L-40,0 M40,0 L70,0 M-50,-50 L-30,-30 M30,30 L50,50 M-50,50 L-30,30 M30,-30 L50,-50" stroke-width="3"/>
    </g>

  <!-- 五雷震位 -->
  <g transform="translate(200,440)" fill="none" stroke="#b8860b" stroke-width="2" opacity="0.5">
    <path d="M-60,0 L-20,0 M20,0 L60,0 M0,-60 L0,-20 M0,20 L0,60"/>
    <path d="M-40,-40 L-15,-15 M15,15 L40,40 M-40,40 L-15,15 M15,-15 L40,-40"/>
    <circle cx="0" cy="0" r="35" stroke-dasharray="5,3"/>
  </g>

  <!-- 印章 -->
  <rect x="160" y="500" width="80" height="80" fill="none" stroke="#b8860b" stroke-width="3"/>
  <text x="200" y="535" text-anchor="middle" fill="#b8860b" font-size="20" font-family="'Noto Serif SC',serif" font-weight="bold">金光</text>
  <text x="200" y="565" text-anchor="middle" fill="#b8860b" font-size="20" font-family="'Noto Serif SC',serif" font-weight="bold">金光</text>

  <!-- 符脚雷纹 -->
  <g fill="none" stroke="#b8860b" stroke-width="1.5" opacity="0.4">
    <path d="M25,25 L35,35 L25,45 L35,55"/>
    <path d="M375,25 L365,35 L375,45 L365,55"/>
    <path d="M25,575 L35,565 L25,555 L35,545"/>
    <path d="M375,575 L365,565 L375,555 L365,545"/>
  </g>

  <!-- 古旧破损 -->
  <g fill="#d4b896" opacity="0.3">
    <circle cx="380" cy="30" r="4"/>
    <circle cx="370" cy="40" r="3"/>
    <circle cx="385" cy="45" r="2.5"/>
    <circle cx="375" cy="20" r="2"/>
    <circle cx="25" cy="570" r="3.5"/>
    <circle cx="20" cy="555" r="2.5"/>
  </g>
</svg>