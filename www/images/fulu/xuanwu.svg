<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="240">
  <defs>
    <filter id="paper5"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="n"/><feDiffuseLighting in="n" lighting-color="#f4e4bc" surfaceScale="1.2"><feDistantLight azimuth="45" elevation="60"/></feDiffuseLighting></filter>
  </defs>
  <rect x="8" y="8" width="384" height="584" fill="#f4e4bc" stroke="#8b5a2b" stroke-width="3" filter="url(#paper5)"/>
  <rect x="16" y="16" width="368" height="568" fill="none" stroke="#8b5a2b" stroke-width="1"/>

  <g fill="#2a4a7a">
    <rect x="120" y="28" width="160" height="48" rx="3"/>
  </g>
  <text x="200" y="60" text-anchor="middle" fill="#f4e4bc" font-size="30" font-family="'Noto Serif SC',serif" font-weight="bold" letter-spacing="4">敕令</text>

  <!-- 玄武(龟蛇相缠) -->
  <g transform="translate(200, 130)" fill="none" stroke="#2a4a7a" stroke-width="2" opacity="0.7">
    <!-- 龟甲 -->
    <ellipse cx="0" cy="0" rx="38" ry="28" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="28" ry="18" stroke-width="1.5" opacity="0.6"/>
    <path d="M-38,0 L-50,0 M38,0 L50,0 M0,-28 L0,-38 M0,28 L0,38"/>
    <path d="M-25,-20 L-30,-28 M25,-20 L30,-28 M-25,20 L-30,28 M25,20 L30,28" stroke-width="1.5"/>
    <!-- 蛇(盘绕) -->
    <path d="M-30,-10 Q-10,-25 10,-15 Q25,-5 15,10 Q5,20 -10,15 Q-20,10 -15,0 Q-10,-8 0,-5" stroke-width="2" fill="none"/>
    <circle cx="-30" cy="-10" r="2.5" fill="#2a4a7a"/>
  </g>

  <!-- 主咒文 -->
  <g fill="#2a4a7a" font-family="'Noto Serif SC',serif" font-weight="bold" text-anchor="middle">
    <text x="200" y="230" font-size="26">玄武镇北</text>
    <text x="200" y="270" font-size="22">北方水德</text>
    <text x="200" y="310" font-size="22">福寿绵长</text>
    <text x="200" y="350" font-size="22">寿山福海</text>
    <text x="200" y="390" font-size="20">急急如律令</text>
  </g>

  <!-- 二十八宿北方七宿 -->
  <g transform="translate(200, 460)" fill="#2a4a7a" font-size="14" font-family="'Noto Serif SC',serif" text-anchor="middle" opacity="0.7">
    <text x="-90" y="0">斗</text>
    <text x="-60" y="-15">牛</text>
    <text x="-30" y="-25">女</text>
    <text x="0" y="-28">虚</text>
    <text x="30" y="-25">危</text>
    <text x="60" y="-15">室</text>
    <text x="90" y="0">壁</text>
    <path d="M-90,0 L-60,-15 L-30,-25 L0,-28 L30,-25 L60,-15 L90,0" fill="none" stroke="#2a4a7a" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  </g>

  <rect x="160" y="510" width="80" height="80" fill="none" stroke="#2a4a7a" stroke-width="3"/>
  <text x="200" y="545" text-anchor="middle" fill="#2a4a7a" font-size="20" font-family="'Noto Serif SC',serif" font-weight="bold">北方</text>
  <text x="200" y="575" text-anchor="middle" fill="#2a4a7a" font-size="20" font-family="'Noto Serif SC',serif" font-weight="bold">玄武</text>

  <g fill="none" stroke="#2a4a7a" stroke-width="1.5" opacity="0.4">
    <path d="M25,25 L35,35 L25,45 L35,55"/>
    <path d="M375,25 L365,35 L375,45 L365,55"/>
    <path d="M25,575 L35,565 L25,555 L35,545"/>
    <path d="M375,575 L365,565 L375,555 L365,545"/>
  </g>
</svg>