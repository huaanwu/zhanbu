<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="240">
  <defs>
    <filter id="paper7"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="n"/><feDiffuseLighting in="n" lighting-color="#f4e4bc" surfaceScale="1.2"><feDistantLight azimuth="45" elevation="60"/></feDiffuseLighting></filter>
  </defs>
  <rect x="8" y="8" width="384" height="584" fill="#f4e4bc" stroke="#8b5a2b" stroke-width="3" filter="url(#paper7)"/>
  <rect x="16" y="16" width="368" height="568" fill="none" stroke="#8b5a2b" stroke-width="1"/>

  <g fill="#5a4a7a">
    <rect x="120" y="28" width="160" height="48" rx="3"/>
  </g>
  <text x="200" y="60" text-anchor="middle" fill="#f4e4bc" font-size="30" font-family="'Noto Serif SC',serif" font-weight="bold" letter-spacing="4">敕令</text>

  <!-- 勾陈(麒麟头) -->
  <g transform="translate(200, 130)" fill="none" stroke="#5a4a7a" stroke-width="2" opacity="0.7">
    <!-- 麒麟角 -->
    <path d="M-10,-25 Q-15,-35 -10,-40 Q0,-45 0,-35 Q0,-25 -10,-25" fill="#5a4a7a"/>
    <path d="M10,-25 Q15,-35 10,-40 Q0,-45 0,-35 Q0,-25 10,-25" fill="#5a4a7a"/>
    <!-- 麒麟头 -->
    <ellipse cx="0" cy="0" rx="28" ry="22" fill="none" stroke-width="2.5"/>
    <circle cx="-12" cy="-5" r="2.5" fill="#5a4a7a"/>
    <circle cx="12" cy="-5" r="2.5" fill="#5a4a7a"/>
    <path d="M-5,5 Q0,10 5,5" fill="none" stroke-width="1.5"/>
    <path d="M-10,10 Q0,18 10,10" fill="none" stroke-width="1.5"/>
    <!-- 麒麟须 -->
    <path d="M-25,5 Q-35,8 -40,15 M25,5 Q35,8 40,15" stroke-width="1.5" fill="none"/>
    <!-- 麒麟鳞 -->
    <path d="M-20,15 Q-15,25 -10,20 M20,15 Q15,25 10,20" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <g fill="#5a4a7a" font-family="'Noto Serif SC',serif" font-weight="bold" text-anchor="middle">
    <text x="200" y="240" font-size="26">勾陈中正</text>
    <text x="200" y="280" font-size="22">中央土德</text>
    <text x="200" y="320" font-size="22">厚德载物</text>
    <text x="200" y="360" font-size="22">四象朝宗</text>
    <text x="200" y="400" font-size="20">急急如律令</text>
  </g>

  <!-- 中央戊己土 -->
  <g transform="translate(200, 460)" fill="none" stroke="#5a4a7a" stroke-width="2" opacity="0.6">
    <rect x="-70" y="-25" width="140" height="50" rx="3"/>
    <text x="0" y="5" text-anchor="middle" fill="#5a4a7a" font-size="18" font-family="'Noto Serif SC',serif" font-weight="bold">中宫土德</text>
    <line x1="-60" y1="15" x2="60" y2="15" stroke-dasharray="4,3"/>
  </g>

  <rect x="160" y="510" width="80" height="80" fill="none" stroke="#5a4a7a" stroke-width="3"/>
  <text x="200" y="545" text-anchor="middle" fill="#5a4a7a" font-size="20" font-family="'Noto Serif SC',serif" font-weight="bold">中央</text>
  <text x="200" y="575" text-anchor="middle" fill="#5a4a7a" font-size="20" font-family="'Noto Serif SC',serif" font-weight="bold">勾陈</text>

  <g fill="none" stroke="#5a4a7a" stroke-width="1.5" opacity="0.4">
    <path d="M25,25 L35,35 L25,45 L35,55"/>
    <path d="M375,25 L365,35 L375,45 L365,55"/>
    <path d="M25,575 L35,565 L25,555 L35,545"/>
    <path d="M375,575 L365,565 L375,555 L365,545"/>
  </g>
</svg>