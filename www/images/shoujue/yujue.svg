<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="180">
  <rect x="10" y="10" width="220" height="260" fill="#fffaf0" stroke="#8b5a2b" stroke-width="2" rx="8"/>

  <!-- 掌心 -->
  <path d="M 65 165 Q 60 155 60 170 L 60 215 Q 60 225 70 225 L 170 225 Q 180 225 180 215 L 180 170 Q 180 155 175 165 L 170 170 L 70 170 Z" fill="#f4c7a1" stroke="#5a3a2a" stroke-width="2"/>
  <!-- 掌纹 -->
  <path d="M 70 180 Q 120 185 170 180" fill="none" stroke="#dba77e" stroke-width="0.6"/>
  <path d="M 75 200 Q 120 205 165 200" fill="none" stroke="#dba77e" stroke-width="0.6"/>
  <path d="M 80 215 Q 120 220 160 215" fill="none" stroke="#dba77e" stroke-width="0.6"/>

  <!-- 玉诀:拇指按住小指和无名指,食指中指弯曲 -->
  <!-- 食指(弯曲扣住) -->
  <path d="M 71 55 Q 71 50 73 48 L 73 130 Q 75 145 80 155 L 78 158 Q 75 160 71 158 L 89 158 Q 87 160 85 158 L 87 155 Q 92 145 90 130 L 87 48 Q 89 50 89 55 Z" fill="#f4c7a1" stroke="#5a3a2a" stroke-width="1.5"/>
  <line x1="74" y1="90" x2="86" y2="90" stroke="#dba77e" stroke-width="0.8"/>
  <line x1="74" y1="125" x2="86" y2="125" stroke="#dba77e" stroke-width="0.8"/>
  <ellipse cx="80" cy="62" rx="5" ry="8" fill="#fce4d0" stroke="#dba77e" stroke-width="0.5"/>

  <!-- 中指(弯曲扣住) -->
  <path d="M 95 110 Q 95 130 100 145 Q 105 155 108 160 L 105 162 Q 100 165 95 162 L 115 162 Q 112 165 108 162 L 110 160 Q 113 155 115 145 Q 120 130 115 110 Z" fill="#f4c7a1" stroke="#5a3a2a" stroke-width="1.5"/>
  <ellipse cx="105" cy="120" rx="7" ry="6" fill="#fce4d0" stroke="#dba77e" stroke-width="0.5"/>

  <!-- 无名指(被拇指按住) -->
  <path d="M 125 120 Q 125 140 130 155 Q 135 165 138 170 L 135 172 Q 130 175 125 172 L 145 172 Q 142 175 138 172 L 140 170 Q 143 165 145 155 Q 150 140 145 120 Z" fill="#dba77e" stroke="#5a3a2a" stroke-width="1.5"/>

  <!-- 小指(被拇指按住) -->
  <path d="M 150 130 Q 150 150 155 165 Q 160 175 163 180 L 160 182 Q 155 185 150 182 L 170 182 Q 167 185 163 182 L 165 180 Q 168 175 170 165 Q 175 150 170 130 Z" fill="#dba77e" stroke="#5a3a2a" stroke-width="1.5"/>

  <!-- 拇指(横跨按住无名指小指) -->
  <path d="M 55 145 Q 50 140 45 145 L 35 175 Q 30 185 35 195 L 60 200 Q 90 205 120 200 Q 145 195 150 185 Q 155 175 145 170 L 60 155 Q 55 145 55 145 Z" fill="#f4c7a1" stroke="#5a3a2a" stroke-width="1.5"/>
  <ellipse cx="50" cy="160" rx="6" ry="5" fill="#fce4d0" stroke="#dba77e" stroke-width="0.5"/>

  <text x="120" y="250" text-anchor="middle" font-size="16" font-family="'Noto Serif SC',serif" font-weight="bold" fill="#5a3a2a">玉诀</text>
  <text x="120" y="268" text-anchor="middle" font-size="9" font-family="'Noto Serif SC',serif" fill="#8b6f2a">拇指压无名指小指，食指中指弯曲扣住</text>
</svg>